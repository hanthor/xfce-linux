name: Promote main to stable

# Release bookmark automation (dakota-style): verifies the newest nightly
# build + ISO on main both succeeded, then fast-forwards the `stable` branch
# to that commit and dispatches the stable build.
#
# Why the explicit dispatch: pushes made with GITHUB_TOKEN do not trigger
# event workflows, but workflow_dispatch via the API does — and the ISO
# build then chains off it via workflow_run.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Promote even if the health checks fail'
        type: boolean
        default: false
  schedule:
    # Weekly on Tuesday 09:00 UTC (after Monday's LUKS e2e)
    - cron: '0 9 * * 2'

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Health check — latest nightly build + ISO green on main
        id: health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          get_latest_run() {
            local wf="$1"
            gh run list --workflow "$wf" --branch main --limit 5 \
              --json status,conclusion,headSha \
              --jq '.[0]'
          }

          BUILD_RUN=$(get_latest_run "Build xfce-linux (Multi-Runner)")
          ISO_RUN=$(get_latest_run "Build and Publish xfce-linux Live ISO")

          BUILD_STATUS=$(echo "$BUILD_RUN" | jq -r '.status // "none"')
          BUILD_CONCL=$(echo "$BUILD_RUN" | jq -r '.conclusion // "none"')
          BUILD_SHA=$(echo "$BUILD_RUN" | jq -r '.headSha // "none"')

          ISO_STATUS=$(echo "$ISO_RUN" | jq -r '.status // "none"')
          ISO_CONCL=$(echo "$ISO_RUN" | jq -r '.conclusion // "none"')
          ISO_SHA=$(echo "$ISO_RUN" | jq -r '.headSha // "none"')

          echo "Build run: status=$BUILD_STATUS conclusion=$BUILD_CONCL sha=$BUILD_SHA"
          echo "ISO run:   status=$ISO_STATUS conclusion=$ISO_CONCL sha=$ISO_SHA"

          CHECK_OK=0
          if [ "$BUILD_STATUS" != "completed" ] || [ "$BUILD_CONCL" != "success" ]; then
            echo "Latest Build run is not completed & successful"
            CHECK_OK=1
          fi
          if [ "$ISO_STATUS" != "completed" ] || [ "$ISO_CONCL" != "success" ]; then
            echo "Latest ISO run is not completed & successful"
            CHECK_OK=1
          fi
          if [ "$BUILD_SHA" = "none" ] || [ "$BUILD_SHA" != "$ISO_SHA" ]; then
            echo "Build SHA ($BUILD_SHA) and ISO SHA ($ISO_SHA) do not match"
            CHECK_OK=1
          fi

          if [ $CHECK_OK -ne 0 ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "Health checks failed but force=true — promoting HEAD of main."
              BUILD_SHA=$(git rev-parse origin/main)
            else
              echo "::error::Health checks failed (build=$BUILD_CONCL, iso=$ISO_CONCL, build_sha=$BUILD_SHA, iso_sha=$ISO_SHA); not promoting. Use force=true to override."
              exit 1
            fi
          fi
          echo "sha=${BUILD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Fast-forward stable to the verified commit
        run: |
          SHA="${{ steps.health.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Promoting ${SHA} to stable"
          git push origin "${SHA}:refs/heads/stable" --force
          echo "stable → ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch stable build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Build xfce-linux (Multi-Runner)" --ref stable
